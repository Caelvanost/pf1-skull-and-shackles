name: Bootstrap Skull & Shackles Repository

on:
  push:
    branches: [main]
    paths:
      - .bootstrap/READY

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part*.b64 > /tmp/pf1ss.b64
          base64 --decode /tmp/pf1ss.b64 > /tmp/pf1ss.zip
          echo "4eb824fc722351e1a9f4a7e45763744f2f96236f26f76e970083da94ea8aee53  /tmp/pf1ss.zip" | sha256sum -c -
          rm -rf /tmp/pf1ss
          mkdir -p /tmp/pf1ss
          unzip -q /tmp/pf1ss.zip -d /tmp/pf1ss
          test -f /tmp/pf1ss/pf1-skull-and-shackles/module.json
          test -f /tmp/pf1ss/pf1-skull-and-shackles/scripts/main.mjs

      - name: Restore repository source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf scripts templates styles macros lang
          rm -f module.json CHANGELOG.md
          cp -a /tmp/pf1ss/pf1-skull-and-shackles/. .
          rm -rf .upload .bootstrap

      - name: Configure Foundry manifest URLs
        shell: python
        run: |
          import json
          from pathlib import Path
          p = Path("module.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          version = data["version"]
          base = "https://github.com/Caelvanost/pf1-skull-and-shackles"
          data["url"] = base
          data["manifest"] = "https://raw.githubusercontent.com/Caelvanost/pf1-skull-and-shackles/main/module.json"
          data["download"] = f"{base}/releases/download/v{version}/pf1-skull-and-shackles-v{version}.zip"
          data["readme"] = f"{base}/blob/main/README.md"
          data["changelog"] = f"{base}/blob/main/CHANGELOG.md"
          data["bugs"] = f"{base}/issues"
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

      - name: Commit restored source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore PF1 Skull & Shackles v1.12.0 source and release metadata"
          git push origin HEAD:main

      - name: Build release ZIP
        shell: pwsh
        run: ./build_release.ps1

      - name: Publish v1.12.0 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(python -c 'import json; print(json.load(open("module.json", encoding="utf-8"))["version"])')"
          tag="v${version}"
          zip="dist/pf1-skull-and-shackles-${tag}.zip"
          target="$(git rev-parse HEAD)"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$zip" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$zip" --repo "$GITHUB_REPOSITORY" --target "$target" --title "PF1 — Skull & Shackles $tag" --generate-notes
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,assets,url
