name: Bootstrap Skull & Shackles Repository

on:
  push:
    branches: [main]
    paths:
      - .bootstrap/READY

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/source.zip
          test -f .bootstrap/SHA256
          expected="$(tr -d '\r\n ' < .bootstrap/SHA256)"
          actual="$(sha256sum .bootstrap/source.zip | awk '{print $1}')"
          test "$actual" = "$expected"
          rm -rf /tmp/pf1ss
          mkdir -p /tmp/pf1ss
          unzip -q .bootstrap/source.zip -d /tmp/pf1ss
          test -f /tmp/pf1ss/pf1-skull-and-shackles/module.json
          test -f /tmp/pf1ss/pf1-skull-and-shackles/scripts/main.mjs

      - name: Restore repository source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf scripts templates styles macros lang
          rm -f module.json CHANGELOG.md README.md
          cp -a /tmp/pf1ss/pf1-skull-and-shackles/. .
          rm -rf .upload .bootstrap

      - name: Configure Foundry manifest and README version
        shell: python
        run: |
          import json, re
          from pathlib import Path

          p = Path("module.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          version = data["version"]
          base = "https://github.com/Caelvanost/pf1-skull-and-shackles"
          data["url"] = base
          data["manifest"] = "https://raw.githubusercontent.com/Caelvanost/pf1-skull-and-shackles/main/module.json"
          data["download"] = f"{base}/releases/download/v{version}/pf1-skull-and-shackles-v{version}.zip"
          data["readme"] = f"{base}/blob/main/README.md"
          data["changelog"] = f"{base}/blob/main/CHANGELOG.md"
          data["bugs"] = f"{base}/issues"
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          rp = Path("README.md")
          if rp.exists():
              text = rp.read_text(encoding="utf-8")
              text = re.sub(r"^# PF1 — Skull & Shackles(?: v[^\n]+)?$", f"# PF1 — Skull & Shackles v{version}", text, count=1, flags=re.M)
              rp.write_text(text, encoding="utf-8")

      - name: Validate restored module
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/main.mjs
          python -m json.tool module.json >/dev/null
          python -m json.tool lang/fr.json >/dev/null

      - name: Commit restored source
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import json; print(json.load(open("module.json", encoding="utf-8"))["version"])')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update PF1 Skull & Shackles to v${version}"
          git push origin HEAD:main
